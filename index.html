<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillPath</title>
    <link rel="stylesheet" href="./css/styles.css" />

    <!-- Vue 3 (global build, no bundlers) -->
    <script defer src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 (global build) -->
    <script defer src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
    <!-- Supabase JS SDK v2 (UMD build exposes global `supabase`) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <!-- App scripts (order matters) -->
    <script defer src="./js/utils.js"></script>
    <script defer src="./js/recommendations.js"></script>
    <script defer src="./js/supabase.js"></script>
    <script defer src="./js/store.js"></script>

    <script defer src="./components/Onboarding.js"></script>
    <script defer src="./components/Survey.js"></script>
    <script defer src="./components/Result.js"></script>
    <script defer src="./components/Skills.js"></script>

    <script defer src="./js/app.js"></script>
  </head>
  <body>
    <noscript>Для работы SkillPath нужен JavaScript.</noscript>

    <div id="app">
      <div class="loading">Загрузка…</div>
    </div>
  </body>
</html>
