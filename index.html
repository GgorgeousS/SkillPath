<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillPath — ваш путь в IT</title>
    <meta name="description" content="SkillPath — веб-сервис для профориентации, оценки навыков и карьерного плана в IT." />
    <!-- Тема применяется до отрисовки, чтобы не было мигания. По умолчанию — светлая. -->
    <script>
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('skillpath_theme') === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <link rel="stylesheet" href="./css/styles.css?v=12" />
    <link rel="stylesheet" href="./css/landing.css?v=12" />
    <link rel="stylesheet" href="./css/dark.css?v=12" />

    <!-- Vue 3 (global build, no bundlers) -->
    <script defer src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 (global build) -->
    <script defer src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>

    <!-- App scripts (order matters) -->
    <script defer src="./js/utils.js?v=12"></script>
    <script defer src="./js/recommendations.js?v=12"></script>
    <script defer src="./js/directions.js?v=12"></script>
    <script defer src="./js/api.js?v=12"></script>
    <script defer src="./js/store.js?v=12"></script>
    <script defer src="./js/auth.js?v=12"></script>

    <script defer src="./components/Onboarding.js?v=12"></script>
    <script defer src="./components/Auth.js?v=12"></script>
    <script defer src="./components/Survey.js?v=12"></script>
    <script defer src="./components/Result.js?v=12"></script>
    <script defer src="./components/Compare.js?v=12"></script>
    <script defer src="./components/Skills.js?v=12"></script>
    <script defer src="./components/RoadmapTimeline.js?v=12"></script>
    <script defer src="./components/Roadmap.js?v=12"></script>
    <script defer src="./components/Plan.js?v=12"></script>
    <script defer src="./components/Progress.js?v=12"></script>
    <script defer src="./components/Knowledge.js?v=12"></script>
    <script defer src="./components/Profile.js?v=12"></script>
    <script defer src="./components/Support.js?v=12"></script>

    <script defer src="./js/app.js?v=12"></script>
  </head>
  <body>
    <noscript>Для работы SkillPath нужен JavaScript.</noscript>

    <div id="app">
      <div class="loading">Загрузка…</div>
    </div>
